[project]
# The name, the license and the URLs wait for Max's decisions (RELEASING.md, "Before the first release").
name = "scriptt"
version = "0.1.0"
description = "A world of facts, types and functions that you can read, test and keep. Ask what was true, and what you knew, on any date."
readme = "README.md"
requires-python = ">=3.14"
keywords = ["bitemporal", "facts", "provenance", "duckdb", "pydantic", "time travel"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.12",
    "duckdb>=2.0",
    "lark>=1.2",
    "dateparser>=1.2",
    "returns>=0.26",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
frames = ["polars>=1.30"]
versions = ["dvc>=3.60"]

[project.urls]
Homepage = "https://scriptt.ai"
Documentation = "https://scriptt.ai/docs/"
Source = "https://github.com/maxtheman/scriptt"
Issues = "https://github.com/maxtheman/scriptt/issues"
Changelog = "https://github.com/maxtheman/scriptt/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scriptt.world"  # a namespace package: scriptt-charts adds scriptt.charts

[tool.uv.workspace]
members = ["packages/scriptt-charts"]
# world-harness is a separate package and is not part of this release. It still imports
# `world` and `world_charts`, the names before 0.1.0.
exclude = ["packages/world-harness"]

[tool.uv.sources]
scriptt-charts = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "jedi>=0.19.2",  # the hover text of the code blocks in the docs (docs/hover.py)
    "ruff>=0.14",  # the docs build checks that each page defines every name it shows
    "scriptt-charts",
    "pytest>=9",
    "pytest-xdist>=3.8",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material==9.7.7",
    "mkdocstrings==1.0.6",
    "mkdocstrings-python==2.0.9",
    "pymdown-extensions>=10.16,<11",
    "ruff>=0.14",
]

[tool.pyright]
exclude = ["docs/_build", "site", "web", ".venv"]  # build output

[tool.ruff]
# Code that the docs show is read on a page: 88 characters fit a page and the notebook.
line-length = 88
target-version = "py314"
extend-exclude = ["docs/_build", "site", "lab"]

[tool.ruff.lint]
# E501: a line longer than 88 characters. F821: a name that is used and never defined. F841: a name that is
# defined and never used.
select = ["E501", "F821", "F841", "F401"]

[tool.ruff.lint.per-file-ignores]
# The examples import every name of a setup module with `import *`, the imported names too.
"tests/*_setup.py" = ["F401"]

[tool.ruff.format]
docstring-code-format = true  # the Example blocks of the docstrings keep the same 88 characters
