<style>
  :root {
    color-scheme: dark;
    --ink:#f8f8f8; --mute:#aeaeae; --faint:#8d8d8d; --rule:#26282c; --bg:#0a0a0a; --card:#111214; --tint:#18191c;
    --type:#89bdff; --type-bg:#16253a; --fn:#65b042; --fn-bg:#15261a; --con:#b9a3c6; --con-bg:#241d2a;
    --accent:#f38ad5; --accent-bg:#33192c; --no:#ff8b8b; --no-bg:#341a1a; --paste:#131417;
    --text: "IBM Plex Sans", system-ui, sans-serif; --ui: "IBM Plex Sans", system-ui, sans-serif; --code: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.4 var(--ui); overflow:hidden; }
  header { height:40px; display:flex; align-items:stretch; gap:0; background:var(--card); border-bottom:1px solid var(--rule); font:13px var(--ui); }
  header .mark { display:flex; align-items:center; padding:0 16px; font:600 15px var(--code); border-right:1px solid var(--rule); }
  header .mark b { color:var(--type); font-weight:600; }
  header .tab { display:flex; align-items:center; padding:0 16px; max-width:50%; color:var(--ink); background:var(--bg); border-right:1px solid var(--rule); box-shadow: inset 0 2px 0 var(--type); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .grow { flex:1; }
  header .status { display:flex; align-items:center; gap:12px; padding:0 12px; font:12px var(--code); color:var(--mute); }
  header #keybtn { align-self:center; margin-right:12px; width:28px; padding:0; border-color:var(--rule); color:var(--mute); }
  #key { position:absolute; top:40px; right:12px; z-index:5; background:var(--card); border:1px solid var(--rule); border-radius:6px; padding:10px 12px; font:12px var(--code); color:var(--mute); display:grid; grid-template-columns:repeat(2, auto); gap:4px 18px; }
  #key[hidden] { display:none; }
  #key i { display:inline-block; width:18px; height:0; border-bottom:2px solid; vertical-align:middle; margin-right:6px; }
  select, button { font:13px var(--ui); height:28px; border:1px solid var(--rule); border-radius:6px; background:var(--card); color:var(--ink); padding:0 10px; }
  button { cursor:pointer; border-color:var(--ink); }
  button.go { background:var(--type); border-color:var(--type); color:#0a0a0a; font-weight:600; }
  button:disabled { opacity:.4; cursor:default; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #board { position:absolute; top:40px; left:0; right:0; bottom:56px; overflow:hidden; }
  #board svg { display:block; touch-action:none; user-select:none; -webkit-user-select:none; }
  #board svg :focus, #board:focus, #board:focus-visible { outline:none; }
  #dock { position:absolute; left:0; right:0; bottom:0; height:56px; border-top:1px solid var(--rule); background:var(--card);
          display:flex; gap:10px; align-items:center; padding:0 16px; font:13px var(--code); overflow-x:auto; white-space:nowrap; }
  #dock .was { color:var(--mute); text-decoration:line-through; }
  #dock .now { color:var(--accent); font-weight:600; }
  #dock .no { color:var(--no); font-weight:600; }
  #dock .sep { color:var(--mute); }
  #dock .grow { flex:1; }
</style>

</div>
