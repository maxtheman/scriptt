<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scriptt board</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --ink:#16181d; --mute:#5b6473; --faint:#9aa2ae; --rule:#d5d9df; --bg:#fbfbfa; --card:#ffffff; --tint:#f0f2f5;
    --type:#1747c9; --type-bg:#e6edff; --fn:#0b7a4b; --fn-bg:#ddf3e8; --con:#7a3fc4; --con-bg:#efe6fb;
    --accent:#c2410c; --accent-bg:#ffedd5; --no:#b42318; --no-bg:#fde8e7; --paste:#f3efe6;
    --text: ui-serif, Georgia, "Iowan Old Style", serif; --ui: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --code: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --ink:#eceff4; --mute:#a2acbb; --faint:#6b7480; --rule:#3a414d; --bg:#14171c; --card:#1c2027; --tint:#232933;
    --type:#8fb0ff; --type-bg:#1f2b4d; --fn:#6fd49a; --fn-bg:#15301f; --con:#c9a2ff; --con-bg:#2c1f45;
    --accent:#fb923c; --accent-bg:#3d2410; --no:#ff8b85; --no-bg:#3a1c1b; --paste:#24221d; } }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.4 var(--ui); overflow:hidden; }
  header { height:44px; display:flex; gap:12px; align-items:center; padding:0 16px; border-bottom:1px solid var(--rule); }
  header .grow { flex:1; }
  header .key { font:12px var(--code); color:var(--mute); display:flex; gap:12px; align-items:center; }
  header .key i { display:inline-block; width:18px; height:0; border-bottom:2px solid; vertical-align:middle; margin-right:4px; }
  select, button { font:13px var(--ui); height:28px; border:1px solid var(--rule); border-radius:6px; background:var(--card); color:var(--ink); padding:0 10px; }
  button { cursor:pointer; border-color:var(--ink); }
  button.go { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.4; cursor:default; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #board { position:absolute; top:44px; left:0; right:0; bottom:56px; overflow:hidden; }
  #board svg { display:block; touch-action:none; user-select:none; -webkit-user-select:none; }
  #board svg :focus, #board:focus, #board:focus-visible { outline:none; }
  #dock { position:absolute; left:0; right:0; bottom:0; height:56px; border-top:1px solid var(--rule); background:var(--card);
          display:flex; gap:10px; align-items:center; padding:0 16px; font:13px var(--code); overflow-x:auto; white-space:nowrap; }
  #dock .was { color:var(--mute); text-decoration:line-through; }
  #dock .now { color:var(--accent); font-weight:600; }
  #dock .no { color:var(--no); font-weight:600; }
  #dock .sep { color:var(--mute); }
  #dock .grow { flex:1; }
</style>
</head>
<body>
<header>
  <strong>scriptt</strong>
  <select id="pick" aria-label="reading"></select>
  <span id="snap" class="key"></span>
  <span class="grow"></span>
  <span class="key" aria-label="key">
    <span><i style="border-color:var(--type)"></i>type</span>
    <span><i style="border-color:var(--con);border-bottom-style:dashed"></i>T[…]</span>
    <span><i style="border-color:var(--fn)"></i>ƒ</span>
    <span><i style="border-color:var(--faint);border-bottom-style:dotted"></i>(none)</span>
    <span><i style="border-color:var(--no);border-bottom-style:dotted"></i>null</span>
    <span style="color:var(--type)">• T</span><span>⇠ at</span><span>↩ ref</span><span>▢ hole</span><span>∅ empty</span><span>⧗ pending</span><span>⏲ deferred</span><span style="color:var(--no)">● complete ✕</span><span>✓ ✕ engine</span><span>⊂ brand</span><span>| sum</span><span>∋ members</span><span>⟷ relations</span><span>✎ corrections</span><span>⟳ newer</span><span>⊘ not built</span>
  </span>
</header>
<div id="board" tabindex="0" aria-label="message"></div>
<div id="dock" role="status" aria-live="polite"></div>
<script src="vendor/dragology-0.2.0.iife.js"></script>
<script src="board.js"></script>
</body>
</html>
