<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scriptt board</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink:#16181d; --mute:#5b6270; --rule:#cfd3da; --bg:#fff; --surface:#f4f5f7; --accent:#1d4ed8; --ok:#157a3b; --no:#b4231f;
    --text: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --code: ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  * { box-sizing: border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:15px/24px var(--text); }
  body { padding: 16px 16px 48px; max-width: 1240px; margin: 0 auto; }
  header { display:flex; gap:8px; align-items:center; height:40px; margin-bottom:8px; }
  header select { flex:1; min-width:0; height:32px; font:14px var(--text); border:1px solid var(--rule); border-radius:6px; padding:0 8px; background:var(--bg); color:var(--ink); }
  button { font:14px var(--text); height:32px; padding:0 12px; border:1px solid var(--ink); border-radius:6px; background:var(--bg); color:var(--ink); cursor:pointer; }
  button:disabled { opacity:.35; cursor:default; }
  button.on { background:var(--ink); color:var(--bg); }
  #board { width:100%; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  #board svg { width:100%; height:auto; display:block; }
  #bar { min-height:32px; font:13px/32px var(--code); color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-top:1px solid var(--rule); }
  #bar .no { color:var(--no); } #bar .ok { color:var(--ok); }
  #panel { display:block; margin-top:8px; max-width: 640px; }
  #stage { position:relative; }
  #sel { position:absolute; z-index:5; width:460px; max-width:100%; max-height:62vh; overflow:auto; background:var(--bg); border:1.5px solid var(--ink); border-radius:10px; padding:8px 14px 12px; box-shadow:0 10px 28px rgba(0,0,0,.16); display:none; }
  @media (max-width: 800px) { #panel { grid-template-columns: 1fr; } }
  #panel h3 { font:600 13px/24px var(--code); margin:0 0 4px; letter-spacing:.02em; color:var(--mute); text-transform:none; }
  #dec { min-height: 96px; }
  .row { display:flex; gap:8px; align-items:baseline; padding:2px 0; flex-wrap:wrap; }
  .k { font:12px/20px var(--code); color:var(--mute); min-width:84px; }
  a.go { color:var(--ink); border-bottom:1px solid var(--accent); cursor:pointer; text-decoration:none; }
  .chip { display:inline-block; font:13px/22px var(--code); border:1px solid var(--rule); border-radius:5px; padding:0 6px; }
  .chip.ok { border-color:var(--ok); } .chip.no { border-color:var(--no); color:var(--no); }
  .act { height:24px; font:12px var(--code); padding:0 8px; }
  .why { font:12px/20px var(--code); color:var(--mute); }
  .bar { display:inline-block; height:6px; background:var(--ink); vertical-align:middle; border-radius:3px; }
  details { border-top:1px solid var(--rule); margin-top:6px; padding-top:4px; } summary { font:600 13px/24px var(--code); color:var(--mute); cursor:pointer; }
  .prov { color:var(--accent); font:12px var(--code); }
  nav.crumb { display:flex; gap:8px; margin-bottom:4px; }
  pre.q { font:12px/18px var(--code); white-space:pre-wrap; margin:4px 0; color:var(--mute); max-height:120px; overflow:auto; }
</style>
</head>
<body>
<header>
  <select id="pick" aria-label="reading"></select>
  <button id="undo" disabled>Undo</button><button id="redo" disabled>Redo</button><button id="reset" disabled>Revert</button>
</header>
<div id="stage"><div id="board"></div><aside id="sel"></aside></div>
<div id="bar"></div>
<div id="panel"><section><h3>decisions</h3><div id="dec"></div></section></div>
<script src="model.js"></script>
<script src="vendor/dragology-0.2.0.iife.js"></script>
<script src="board.js"></script>
<script>if (/[?&]audit/.test(location.search)) document.head.append(Object.assign(document.createElement("script"), { src: "audit.js" }));</script>
</body>
</html>
