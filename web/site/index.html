<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scriptt board</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --ink:#16181d; --mute:#566070; --rule:#c9ced6; --bg:#fbfbfa; --card:#fff; --tint:#eef0f3;
    --accent:#1747c9; --accent-bg:#e6edff; --ok:#12663a; --no:#a3201c; --warn:#8a5a00;
    --text: ui-serif, Georgia, "Iowan Old Style", serif; --ui: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --code: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) { :root { --ink:#eceff4; --mute:#a2acbb; --rule:#3a414d; --bg:#14171c; --card:#1c2027; --tint:#222831; --accent:#8fb0ff; --accent-bg:#1f2b4d; --ok:#6fd49a; --no:#ff8b85; --warn:#e5b95c; } }
  * { box-sizing: border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--ui); }
  body { padding:16px 20px 64px; max-width:980px; margin:0 auto; }
  header { display:flex; gap:10px; align-items:center; flex-wrap:wrap; min-height:40px; font-size:14px; color:var(--mute); }
  header .grow { flex:1; }
  button { font:14px var(--ui); min-height:30px; padding:0 12px; border:1px solid var(--ink); border-radius:6px; background:var(--card); color:var(--ink); cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  @media (prefers-color-scheme: dark) { button.primary { color:#0b1020; } }
  select { font:14px var(--ui); min-height:30px; border:1px solid var(--rule); border-radius:6px; background:var(--card); color:var(--ink); padding:0 8px; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; border-radius:4px; }

  #stage { position:relative; margin-top:28px; }
  #text { position:relative; font:24px/3.3 var(--text); margin:0; padding:0 0 28px; white-space:pre-wrap; cursor:default; }
  #text .w { border-radius:3px; cursor:pointer; }
  #text .w:hover { background:var(--tint); }
  /* one phrase = one brick: its operation is the stud on top-left, its words are the body, the bar is its underside */
  .ph { box-decoration-break:clone; -webkit-box-decoration-break:clone; border-bottom:3px solid var(--rule); padding-bottom:2px; }
  .ph.unres { border-bottom-style:dashed; }
  .op { font:600 13px/1 var(--code); display:inline-block; vertical-align:.55em; margin-right:6px; padding:5px 8px; border:1.5px solid var(--ink); border-radius:6px 6px 6px 0; background:var(--card); color:var(--ink); cursor:grab; }
  .op .ty { font-weight:400; color:var(--mute); margin-left:6px; }
  .op .st { font-weight:600; margin-left:8px; padding-left:8px; border-left:1px solid var(--rule); }
  .op .st.ready { color:var(--ok); } .op .st.waits, .op .st.UNVERIFIED { color:var(--warn); } .op .st.FAIL, .op .st.invalid { color:var(--no); } .op .st.PASS { color:var(--ok); }
  .val { position:relative; display:inline-block; line-height:1.1; padding:3px 7px 22px; margin:0 1px; border-radius:8px; background:var(--tint); border:1.5px solid var(--ink); cursor:grab; vertical-align:baseline; }
  .val .pl { position:absolute; left:6px; right:4px; bottom:2px; font:12px/16px var(--code); color:var(--mute); white-space:nowrap; cursor:pointer; text-decoration:underline dotted; }
  .val .pl + .pl { left:auto; }
  .sock { white-space:nowrap; font:13px/1 var(--code); display:inline-block; vertical-align:.3em; margin-left:6px; padding:6px 9px; border:1.5px dashed var(--ink); border-radius:999px; background:var(--card); cursor:pointer; }
  .sock.hole { border-style:dotted; color:var(--no); }
  .sock .arrow { color:var(--mute); }
  .mark { font:12px var(--code); margin-left:3px; color:var(--accent); }
  [data-fit="ok"] { box-shadow:0 0 0 3px var(--ok); background:var(--card); }
  [data-fit="no"] { opacity:.55; text-decoration:line-through wavy var(--no) 1px; }
  [data-fit="here"] { box-shadow:0 0 0 2px var(--mute); }
  .hot { box-shadow:0 0 0 4px var(--accent) !important; }
  .sel { box-shadow:0 0 0 3px var(--accent); background:var(--accent-bg); }
  .linked { box-shadow:0 0 0 3px var(--accent); }
  .chg { box-shadow:0 0 0 3px var(--warn); }
  .ghost { position:fixed; z-index:50; pointer-events:none; font:600 15px var(--ui); background:var(--accent); color:#fff; padding:4px 10px; border-radius:8px; opacity:.92; }
  @media (prefers-color-scheme: dark) { .ghost { color:#0b1020; } }
  body.carrying #text { cursor:copy; }
  svg#arcs { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  svg#arcs path { fill:none; stroke:var(--mute); stroke-width:1.5; stroke-dasharray:4 3; }
  svg#arcs path.on { stroke:var(--accent); stroke-width:2.5; stroke-dasharray:none; }

  #card { position:absolute; z-index:20; width:min(420px, calc(100% - 8px)); max-height:min(40vh, 380px); overflow:auto; background:var(--card); border:2px solid var(--accent); border-radius:10px; padding:10px 14px 12px; font:14px/1.45 var(--ui); box-shadow:0 8px 24px rgba(0,0,0,.18); }
  #card[hidden] { display:none; }
  #card h2 { font:600 15px/1.35 var(--ui); margin:0 24px 2px 0; }
  #card .sub { color:var(--mute); font-size:13px; margin:0 0 6px; }
  #card .x { position:absolute; right:8px; top:6px; min-height:24px; padding:0 7px; border-color:var(--rule); }
  #card ul { list-style:none; margin:4px 0 0; padding:0; }
  #card li { border-top:1px solid var(--rule); }
  #card .rel { all:unset; box-sizing:border-box; display:flex; width:100%; gap:8px; padding:6px 0; cursor:pointer; align-items:baseline; }
  #card .rel:focus-visible { outline:3px solid var(--accent); }
  #card .rel .k { color:var(--mute); min-width:76px; font-size:13px; }
  #card .rel .v { flex:1; } #card .rel .c { color:var(--mute); }
  #card .body { padding:2px 0 8px 84px; font-size:13px; }
  #card .body p { margin:2px 0; }
  .t { font:13px var(--code); background:var(--tint); border-radius:4px; padding:0 4px; }
  button.link { all:unset; cursor:pointer; color:var(--accent); text-decoration:underline; font:13px var(--code); }
  button.link:focus-visible { outline:3px solid var(--accent); }
  .row { display:flex; gap:8px; align-items:baseline; padding:3px 0; }
  .row button { all:unset; cursor:pointer; flex:1; padding:2px 4px; border-radius:4px; }
  .row button:focus-visible { outline:3px solid var(--accent); }
  .row button:hover { background:var(--tint); }
  .no { color:var(--no); } .ok { color:var(--ok); } .warn { color:var(--warn); } .mute { color:var(--mute); }
  .bar { display:inline-block; height:7px; background:var(--ink); border-radius:3px; vertical-align:middle; margin-right:6px; }
  .prov { font:12px var(--code); color:var(--warn); }
  .chgline { font:13px/1.4 var(--code); padding:3px 0; border-top:1px solid var(--rule); }
  .chgline .was { text-decoration:line-through; color:var(--mute); }
  .actions { display:flex; gap:8px; margin-top:8px; }
  #msg { margin-top:12px; min-height:24px; font:13px var(--code); color:var(--mute); }
</style>
</head>
<body>
<header>
  <strong>scriptt</strong>
  <select id="pick" aria-label="reading" hidden></select>
  <span id="snap"></span>
  <span class="grow"></span>
  <button id="older" aria-haspopup="true">Earlier snapshots</button>
  <button id="rerun">Rerun with d1</button>
</header>
<div id="stage">
  <p id="text" aria-label="the message, as the engine read it"></p>
  <svg id="arcs" aria-hidden="true"></svg>
  <section id="card" hidden role="dialog" aria-label="selection"></section>
</div>
<div id="msg" role="status" aria-live="polite"></div>
<script src="board.js"></script>
</body>
</html>
