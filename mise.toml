# Tools and tasks for the World API workspace (https://mise.jdx.dev). Run `mise install`, then `mise run <task>`.
[tools]
python = "3.14"
uv = "0.13.0"

[tasks.sync]
description = "Install both packages, editable, with the extras and the docs tools"
run = "uv sync --all-packages --all-extras --group docs"

[tasks.pages]
description = "Run every example and case, and build the pages in docs/_build (stops on a failure)"
run = "uv run python -m docs.build"

[tasks.docs]
description = "Build the docs site with the API reference of both packages into site/"
depends = ["pages"]
run = "uv run --group docs mkdocs build --strict -f docs/mkdocs.yml"

[tasks.serve]
description = "Serve the docs site on http://localhost:2744"
depends = ["pages"]
run = "uv run --group docs mkdocs serve -f docs/mkdocs.yml -a localhost:2744"

[tasks.check]
description = "Lint (88 characters, names defined and used) and type-check the code"
run = [
  "uv run ruff check src packages/scriptt-charts/src docs tests scripts",
  "uvx pyright@1.1.407 --pythonpath .venv/bin/python src packages/scriptt-charts/src docs tests scripts",
]

[tasks.test]
description = "Run the example of each docstring and of README.md (pytest, 8 workers)"
run = "uv run pytest -n 8 tests"

[tasks.build]
description = "Build the wheel and the source archive of scriptt and scriptt-charts into dist/"
run = ["uv build --package scriptt", "uv build --package scriptt-charts"]

[tasks.site]
description = "Build the scriptt.ai site (landing page and docs) into web/public"
run = "sh web/build.sh"
