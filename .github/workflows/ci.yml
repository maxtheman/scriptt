# Lint, type-check, test and build on each push to main and each pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.14"
          enable-cache: true
      - name: Install the workspace
        run: uv sync --locked --all-packages --all-extras --group docs
      - name: Lint (ruff)
        run: uv run ruff check src packages/scriptt-charts/src docs tests scripts
      - name: Type-check (pyright)
        run: uvx pyright@1.1.407 --pythonpath .venv/bin/python src packages/scriptt-charts/src docs tests scripts
      - name: Test (the docstring and README examples)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          uv run pytest -n auto tests
      - name: Build the wheels and source archives
        run: |
          uv build --package scriptt --out-dir dist
          uv build --package scriptt-charts --out-dir dist
          uvx twine@6.2.0 check --strict dist/*

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.14"
          enable-cache: true
      - name: Install the workspace
        run: uv sync --locked --all-packages --all-extras --group docs
      - name: Run every example and case, and build the pages
        run: uv run python -m docs.build
      - name: Build the site
        run: uv run --group docs mkdocs build --strict -f docs/mkdocs.yml
