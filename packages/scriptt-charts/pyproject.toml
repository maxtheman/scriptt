[project]
name = "scriptt-charts"
version = "0.1.0"
description = "Charts for scriptt results that show their evidence: counts, sources, scope, flags and assumptions. Vega-Lite, Altair, HTML or a table."
readme = "README.md"
requires-python = ">=3.14"
# scriptt and scriptt-charts are released together with the same version (RELEASING.md).
dependencies = ["scriptt>=0.1,<0.2"]
keywords = ["charts", "vega-lite", "altair", "provenance", "scriptt"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]

[project.optional-dependencies]
altair = ["altair>=5.4", "pandas>=2.2"]

[project.urls]
Homepage = "https://scriptt.ai"
Source = "https://github.com/maxtheman/scriptt/tree/main/packages/scriptt-charts"
Changelog = "https://github.com/maxtheman/scriptt/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scriptt.charts"

[tool.uv.sources]
scriptt = { workspace = true }
